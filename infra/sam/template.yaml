AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Minimal infrastructure skeleton for the AIOA Non-Zero CloudOps Agent

Parameters:
  SandboxInstanceId:
    Type: String
    Description: Explicit preconfigured sandbox EC2 instance; no discovery is permitted
    AllowedPattern: ^i-[0-9a-f]{8}([0-9a-f]{9})?$
  AwsMutationsEnabled:
    Type: String
    Default: "false"
    AllowedValues:
      - "false"
      - "true"
  AllowLiveSandboxStop:
    Type: String
    Default: "false"
    AllowedValues:
      - "false"
      - "true"
  EmergencyExecutionDisabled:
    Type: String
    Default: "true"
    AllowedValues:
      - "false"
      - "true"

Resources:
  HealthHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: "$default"

  HealthFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: LambdaLogDelivery
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-health:*

  HealthFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/${AWS::StackName}-health
      RetentionInDays: 3

  RemediationExecutorRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: RemediationLogDelivery
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-remediation-executor:*
        - PolicyName: StopConfiguredTaggedSandboxOnly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ec2:StopInstances
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${SandboxInstanceId}
                Condition:
                  StringEquals:
                    aws:RequestedRegion: eu-central-1
                    aws:ResourceTag/AIOACloudOpsSandbox: "true"

  RemediationExecutorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/${AWS::StackName}-remediation-executor
      RetentionInDays: 3

  RemediationExecutorFunction:
    Type: AWS::Serverless::Function
    DependsOn: RemediationExecutorLogGroup
    Properties:
      FunctionName:
        Fn::Sub: ${AWS::StackName}-remediation-executor
      CodeUri: ../../src/
      Handler: aioa_cloudops_agent.remediation.lambda_handler.lambda_handler
      Runtime: python3.12
      Architectures:
        - x86_64
      MemorySize: 256
      Timeout: 15
      ReservedConcurrentExecutions: 1
      Role:
        Fn::GetAtt:
          - RemediationExecutorRole
          - Arn
      Environment:
        Variables:
          AWS_MUTATIONS_ENABLED:
            Ref: AwsMutationsEnabled
          AIOA_ALLOW_LIVE_SANDBOX_STOP:
            Ref: AllowLiveSandboxStop
          AIOA_EMERGENCY_EXECUTION_DISABLED:
            Ref: EmergencyExecutionDisabled
          SANDBOX_INSTANCE_ID:
            Ref: SandboxInstanceId
          SANDBOX_REQUIRED_TAG_KEY: AIOACloudOpsSandbox
          SANDBOX_REQUIRED_TAG_VALUE: "true"

  OrchestratorInvokeRemediationPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Invoke only the private approval-bound remediation executor
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - lambda:InvokeFunction
            Resource:
              Fn::GetAtt:
                - RemediationExecutorFunction
                - Arn

  StateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  StatePersistencePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Future least-privilege access to Non-Zero state records
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
            Resource:
              Fn::GetAtt:
                - StateTable
                - Arn

  HealthFunction:
    Type: AWS::Serverless::Function
    DependsOn: HealthFunctionLogGroup
    Properties:
      FunctionName:
        Fn::Sub: ${AWS::StackName}-health
      CodeUri: ../../src/
      Handler: aioa_cloudops_agent.handlers.health.lambda_handler
      Runtime: python3.12
      Architectures:
        - x86_64
      MemorySize: 256
      Timeout: 10
      ReservedConcurrentExecutions: 2
      Role:
        Fn::GetAtt:
          - HealthFunctionRole
          - Arn
      Environment:
        Variables:
          APP_STAGE: hackathon
          AWS_MUTATIONS_ENABLED: "false"
          MODEL_MAX_OUTPUT_TOKENS: "1024"
          STATE_TABLE_NAME:
            Ref: StateTable
      Events:
        HealthRoute:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: HealthHttpApi
            Path: /health
            Method: GET

Outputs:
  HealthApiEndpoint:
    Description: Public health endpoint for the HTTP API default stage
    Value:
      Fn::Sub: https://${HealthHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/health
  HealthFunctionName:
    Description: Health Lambda function name
    Value:
      Ref: HealthFunction
  StateTableName:
    Description: Future Non-Zero state and provenance table name
    Value:
      Ref: StateTable
  RemediationExecutorFunctionName:
    Description: Private approval-bound remediation executor function name
    Value:
      Ref: RemediationExecutorFunction
